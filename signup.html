<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 | HANA PROFILE</title>
<link rel="stylesheet" href="style.css">

<style>
.signup-box{
    max-width:450px;
    margin:60px auto;
    background:#fff;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}
.signup-box h1{
    text-align:center;
    margin-bottom:25px;
}
.signup-box input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    box-sizing:border-box;
}
.signup-box button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#007bff;
    color:white;
    font-size:17px;
    cursor:pointer;
}
.signup-box button:hover{
    background:#0056b3;
}
.login-link{
    text-align:center;
    margin-top:20px;
}
.login-link a{
    color:#007bff;
    text-decoration:none;
}
</style>

</head>
<body>

<div class="signup-box">

<h1>회원가입</h1>

<input type="text" placeholder="아이디">

<input type="email" placeholder="이메일">

<input type="password" placeholder="비밀번호">

<input type="password" placeholder="비밀번호 확인">

<button>회원가입</button>

<div class="login-link">
이미 계정이 있나요?
<a href="login.html">로그인</a>
</div>

</div>

</body>
</html>
