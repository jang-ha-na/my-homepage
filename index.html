<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HANA PROFILE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f7;
    color:#222;
}

header{
    background:#1f1f1f;
    color:white;
    text-align:center;
    padding:30px;
}

header h1{
    font-size:40px;
}

nav{
    background:#333;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:25px;
    padding:15px;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
}

nav a:hover{
    color:#4da3ff;
}

.hero{
    text-align:center;
    padding:80px 20px;
}

.hero h1{
    font-size:50px;
    margin-bottom:20px;
}

.hero p{
    font-size:20px;
    margin-bottom:15px;
}

button{
    margin-top:20px;
    background:#007bff;
    color:white;
    border:none;
    padding:15px 35px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

.container{
    width:90%;
    max-width:900px;
    margin:50px auto;
}

.card{
    background:white;
    padding:25px;
    margin-bottom:30px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.card h2{
    margin-bottom:20px;
}

.card p{
    margin:10px 0;
    font-size:18px;
}

footer{
    background:#1f1f1f;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:50px;
}

@media(max-width:700px){

header h1{
    font-size:32px;
}

.hero h1{
    font-size:38px;
}

.hero p{
    font-size:18px;
}

nav{
    gap:15px;
}

nav a{
    font-size:16px;
}
}
</style>

</head>

<body>

<header>
<h1>HANA PROFILE</h1>
</header>

<nav>
<a href="#">홈</a>
<a href="#">자기소개</a>
<a href="#">프로젝트</a>
<a href="#">게시판</a>
<a href="#">문의하기</a>
</nav>

<section class="hero">
<h1>환영합니다! 👋</h1>

<p>장하나의 개인 홈페이지입니다.</p>

<p>전자공학 · 웹개발 ·
