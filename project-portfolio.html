
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>개인 포트폴리오</title>

<link rel="stylesheet" href="style.css">

<style>
.project-detail{
    max-width:900px;
    margin:40px auto;
    padding:20px;
}

.project-detail img{
    width:100%;
    border-radius:10px;
    margin:20px 0;
}

.tech{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:20px 0;
}

.tech span{
    background:#4f6df5;
    color:#fff;
    padding:8px 15px;
    border-radius:20px;
}

.back-btn{
    display:inline-block;
    margin-top:30px;
    padding:12px 25px;
    background:#4f6df5;
    color:white;
    text-decoration:none;
    border-radius:8px;
}
    .project-detail h2{
    color:#7dd3fc;
}

.project-detail p,
.project-detail li{
    color:#f3f4f6;
}
/* ==========================
   프로젝트 공통 디자인
========================== */

.project-detail{
    max-width:1000px;
    margin:50px auto;
    padding:20px;
}

/* 대제목 */
.project-detail h1{
    color:#ffffff;
    font-size:58px;
    font-weight:900;
    text-align:center;
    margin-bottom:40px;
    text-shadow:0 0 15px rgba(96,165,250,.6);
}

/* 개발정보 박스 */
.info-box{
    background:linear-gradient(135deg,#1e3a8a,#312e81);
    border-left:6px solid #60a5fa;
    border-radius:20px;
    padding:25px;
    margin:35px 0;
    box-shadow:0 10px 30px rgba(37,99,235,.35);
}

.info-box p{
    color:white;
    font-size:22px;
    margin:10px 0;
}

.info-box strong{
    color:#7dd3fc;
}

/* 이미지 */
.project-detail img{
    width:85%;
    display:block;
    margin:35px auto;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

/* 소제목 */
.project-detail h2{
    color:#7dd3fc;
    font-size:42px;
    margin-top:40px;
    margin-bottom:15px;
}

/* 내용 */
.project-detail p,
.project-detail li{
    color:#f3f4f6;
    font-size:22px;
    line-height:1.8;
}

/* 기술 스택 */
.tech{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin:25px 0;
}

.tech span{
    background:linear-gradient(135deg,#3b82f6,#6366f1);
    color:white;
    padding:12px 24px;
    border-radius:999px;
    font-size:20px;
    font-weight:bold;
}

/* 버튼 */
.back-btn{
    display:inline-block;
    margin-top:40px;
    padding:15px 30px;
    background:#2563eb;
    color:white;
    border-radius:12px;
    text-decoration:none;
    font-weight:bold;
}

.back-btn:hover{
    background:#1d4ed8;
}

/* 모바일 */
@media(max-width:768px){

    .project-detail h1{
        font-size:40px;
    }

    .project-detail h2{
        font-size:30px;
    }

    .project-detail img{
        width:100%;
    }

    .project-detail p,
    .project-detail li{
        font-size:18px;
    }

    .info-box p{
        font-size:18px;
    }

    .tech span{
        font-size:16px;
        padding:10px 18px;
    }
}
   
</style>

</head>
<body>

<div class="project-detail">

<h1>
개인 포트폴리오<br>
홈페이지
</h1>

<img src="images/main.jpg" alt="포트폴리오">

<h2>프로젝트 소개</h2>

<p>
HTML, CSS, JavaScript, Firebase를 활용하여 제작한 반응형 개인 포트폴리오 웹사이트입니다.
</p>

<h2>사용 기술</h2>

<div class="tech">
<span>HTML5</span>
<span>CSS3</span>
<span>JavaScript</span>
<span>Firebase</span>
<span>GitHub Pages</span>
</div>

<h2>구현 기능</h2>

<ul>
<li>반응형 웹 디자인</li>
<li>다크모드</li>
<li>햄버거 메뉴</li>
<li>Firebase 로그인</li>
<li>Firestore 게시판</li>
<li>GitHub Pages 배포</li>
</ul>

<h2>GitHub</h2>

<p>
GitHub 저장소와 실제 홈페이지에서 프로젝트를 확인할 수 있습니다.
</p>

<a href="index.html" class="back-btn">← 메인으로</a>

</div>

</body>
</html>
